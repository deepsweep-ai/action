name: 'DeepSweep Security'
description: 'Validate AI coding assistant configurations for security issues'
author: 'DeepSweep'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  path:
    description: 'Path to validate (default: current directory)'
    required: false
    default: '.'

  fail-on:
    description: 'Minimum severity to fail the check (critical, high, medium, low, none)'
    required: false
    default: 'high'

  upload-sarif:
    description: 'Upload SARIF results to GitHub Security tab'
    required: false
    default: 'true'

  comment-on-pr:
    description: 'Post validation results as PR comment'
    required: false
    default: 'true'

  include-mcp:
    description: 'Include MCP server configuration checks'
    required: false
    default: 'true'

  version:
    description: 'DeepSweep CLI version to install'
    required: false
    default: 'latest'

  api-key:
    description: 'DeepSweep API key for paid plans (pass from secrets)'
    required: false
    default: ''

  telemetry:
    description: 'Send anonymous DeepSweep telemetry from CI (true/false)'
    required: false
    default: 'false'

  github-token:
    description: 'Token used to post the PR comment'
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: 'Security score (0-100)'
    value: ${{ steps.report.outputs.score }}

  grade:
    description: 'Security grade (A-F)'
    value: ${{ steps.report.outputs.grade }}

  findings-count:
    description: 'Total number of findings'
    value: ${{ steps.report.outputs.findings-count }}

  critical-count:
    description: 'Number of critical findings'
    value: ${{ steps.report.outputs.critical-count }}

  sarif-file:
    description: 'Path to generated SARIF file'
    value: ${{ steps.validate.outputs.sarif-file }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install DeepSweep
      shell: bash
      env:
        DS_VERSION: ${{ inputs.version }}
      run: |
        python -m venv "$RUNNER_TEMP/deepsweep-venv"
        if [ "$DS_VERSION" = "latest" ]; then
          "$RUNNER_TEMP/deepsweep-venv/bin/pip" install --quiet deepsweep-ai
        else
          "$RUNNER_TEMP/deepsweep-venv/bin/pip" install --quiet "deepsweep-ai==$DS_VERSION"
        fi
        echo "$RUNNER_TEMP/deepsweep-venv/bin" >> "$GITHUB_PATH"

    - name: Run validation
      id: validate
      shell: bash
      env:
        DS_PATH: ${{ inputs.path }}
        DS_INCLUDE_MCP: ${{ inputs.include-mcp }}
        DS_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        DEEPSWEEP_API_KEY: ${{ inputs.api-key }}
        DS_TELEMETRY: ${{ inputs.telemetry }}
      run: |
        if [ "$DS_TELEMETRY" != "true" ]; then export DEEPSWEEP_OFFLINE=1; fi
        [ -n "$DEEPSWEEP_API_KEY" ] || unset DEEPSWEEP_API_KEY

        ARGS=(validate "$DS_PATH" --no-share --no-color)
        if [ "$DS_INCLUDE_MCP" = "true" ]; then ARGS+=(--include-mcp); fi

        RESULTS="$RUNNER_TEMP/deepsweep-results.json"
        SARIF="$GITHUB_WORKSPACE/deepsweep-results.sarif"
        rm -f "$RESULTS" "$SARIF"

        # The CLI exits 1 whenever findings exist; thresholds are enforced in a later step.
        deepsweep "${ARGS[@]}" --format json --output "$RESULTS" > "$RUNNER_TEMP/deepsweep-stdout.txt" 2>&1 || true
        if [ ! -s "$RESULTS" ]; then
          cat "$RUNNER_TEMP/deepsweep-stdout.txt"
          echo "::error::DeepSweep did not produce results. If the output above mentions a quota, set the api-key input."
          exit 1
        fi

        if [ "$DS_UPLOAD_SARIF" = "true" ]; then
          deepsweep "${ARGS[@]}" --format sarif --output "$SARIF" > /dev/null 2>&1 || true
          if [ -s "$SARIF" ]; then echo "sarif-file=$SARIF" >> "$GITHUB_OUTPUT"; fi
        fi
        echo "results-file=$RESULTS" >> "$GITHUB_OUTPUT"

    - name: Summarize results
      id: report
      shell: bash
      env:
        DS_FAIL_ON: ${{ inputs.fail-on }}
        DS_RESULTS: ${{ steps.validate.outputs.results-file }}
        DS_SARIF: ${{ steps.validate.outputs.sarif-file }}
      run: |
        python "$GITHUB_ACTION_PATH/scripts/report.py" \
          --results "$DS_RESULTS" \
          --sarif "$DS_SARIF" \
          --fail-on "$DS_FAIL_ON" \
          --comment-file "$RUNNER_TEMP/deepsweep-comment.md"

    # Fork PRs get a read-only token, so SARIF upload and PR comments are best-effort.
    - name: Upload SARIF
      if: inputs.upload-sarif == 'true' && steps.validate.outputs.sarif-file != ''
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.validate.outputs.sarif-file }}
        category: deepsweep

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        DS_COMMENT_FILE: ${{ runner.temp }}/deepsweep-comment.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.DS_COMMENT_FILE, 'utf8');
          const marker = '<!-- deepsweep-validation -->';
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
          const existing = comments.find(c => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Check threshold
      if: steps.report.outputs.failed == 'true'
      shell: bash
      env:
        DS_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "[FAIL] Validation failed: items to review at or above '$DS_FAIL_ON' severity."
        echo "See the job summary or the Security tab for how to address each item."
        exit 1
