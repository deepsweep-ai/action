# Advanced workflow with matrix, caching, and conditional steps
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday 6am

jobs:
  validate:
    name: DeepSweep Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write    # Required for PR comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run DeepSweep
        id: deepsweep
        uses: deepsweep-ai/action@v1
        with:
          path: '.'
          fail-below-score: 70
          comment-on-pr: 'true'

      - name: Report findings
        if: steps.deepsweep.outputs.findings != '0'
        run: |
          echo "[WARN] ${{ steps.deepsweep.outputs.findings }} finding(s) — see the PR comment"

      - name: Badge update
        if: github.ref == 'refs/heads/main'
        run: |
          # Posture is always reported with its attestation tier, never as a bare
          # number: it describes protections observed in the agent-writable
          # environment, not a verified safety result.
          echo "Posture: ${{ steps.deepsweep.outputs.score }}/100 (${{ steps.deepsweep.outputs.posture-band }}) — identity ${{ steps.deepsweep.outputs.attestation }}, not verified"
          echo "${{ steps.deepsweep.outputs.badge-markdown }}"
